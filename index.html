<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Tools Demo</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-glow" aria-hidden="true"></div>
    <header class="site-header">
      <nav class="nav" aria-label="主导航">
        <a class="brand" href="#">
          <span class="brand-mark" aria-hidden="true"></span>
          AI Tools Demo
        </a>
        <div class="nav-links">
          <a href="#tools">工具</a>
          <a href="#experience">体验</a>
          <a href="#about">关于</a>
        </div>
      </nav>
    </header>

    <main>
      <section class="hero" id="experience">
        <div class="hero-content">
          <p class="eyebrow">AI Tool Directory</p>
          <h1>AI Tools Demo</h1>
          <p class="intro">一个用于测试上线流程的 AI 工具导航网站</p>
          <button class="primary-button" type="button" id="tryButton">
            <span>立即体验</span>
            <span aria-hidden="true">→</span>
          </button>
        </div>
        <div class="hero-panel" aria-hidden="true">
          <div class="panel-line"></div>
          <div class="panel-line short"></div>
          <div class="panel-grid">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      </section>

      <section class="tools-section" id="tools" aria-labelledby="tools-title">
        <div class="section-heading">
          <p class="eyebrow">精选工具</p>
          <h2 id="tools-title">快速探索 AI 能力</h2>
        </div>

        <div class="tool-grid">
          <article class="tool-card">
            <div class="tool-icon" aria-hidden="true">W</div>
            <h3>AI 写作助手</h3>
            <p>用于生成短文、标题和营销文案的测试入口。</p>
          </article>

          <article class="tool-card">
            <div class="tool-icon" aria-hidden="true">I</div>
            <h3>AI 图片生成器</h3>
            <p>用于展示图片创意生成流程的占位工具。</p>
          </article>

          <article class="tool-card">
            <div class="tool-icon" aria-hidden="true">P</div>
            <h3>AI 网页生成器</h3>
            <p>用于模拟从需求到页面原型的生成体验。</p>
          </article>
        </div>
      </section>
    </main>

    <footer class="site-footer" id="about">
      Demo Website Only
    </footer>

    <script src="script.js"></script>
  </body>
</html>
