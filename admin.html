<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI Efficiency Studio 的 localStorage Demo 后台，用于展示本地提交记录。" />
    <title>Demo Admin Panel | AI Efficiency Studio</title>
    <link rel="stylesheet" href="style.css?v=20260529" />
  </head>
  <body>
    <div class="page-glow" aria-hidden="true"></div>
    <header class="site-header">
      <nav class="nav" aria-label="主导航">
        <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true"></span>AI Efficiency Studio</a>
        <div class="nav-links">
          <a href="index.html">首页</a>
          <a href="product.html">产品</a>
          <a href="pricing.html">价格</a>
          <a href="index.html#request">提交需求</a>
          <a href="admin.html">Demo 后台</a>
          <a href="privacy.html">隐私</a>
          <a href="terms.html">条款</a>
        </div>
      </nav>
    </header>

    <main>
      <section class="page-hero">
        <p class="eyebrow">Admin Demo</p>
        <h1>Demo Admin Panel</h1>
        <p class="intro">这是 Demo 后台，数据保存在本地浏览器 localStorage，不是真实服务器数据库。</p>
      </section>

      <section class="admin-section">
        <div class="stats-grid">
          <article class="stat-card"><span>今日提交</span><strong id="todayCount">0</strong></article>
          <article class="stat-card"><span>待处理需求</span><strong id="pendingCount">0</strong></article>
          <article class="stat-card"><span>已完成</span><strong id="completedCount">0</strong></article>
        </div>

        <div class="admin-grid">
          <article class="admin-card">
            <h2>套餐分布</h2>
            <div class="progress-row"><span>Basic Plan</span><div><i id="basicProgress" style="width: 0%"></i></div><b id="basicPercent">0%</b></div>
            <div class="progress-row"><span>Pro Plan</span><div><i id="proProgress" style="width: 0%"></i></div><b id="proPercent">0%</b></div>
            <div class="progress-row"><span>Business Plan</span><div><i id="businessProgress" style="width: 0%"></i></div><b id="businessPercent">0%</b></div>
          </article>

          <article class="admin-card">
            <div class="admin-card-header">
              <h2>最近提交</h2>
              <button class="secondary-button small-button" type="button" id="clearDemoData">清空 Demo 数据</button>
            </div>
            <div class="request-table-wrap">
              <table class="request-table">
                <thead>
                  <tr>
                    <th>提交时间</th>
                    <th>姓名</th>
                    <th>联系方式</th>
                    <th>需求类型</th>
                    <th>预算</th>
                    <th>套餐</th>
                    <th>备注</th>
                  </tr>
                </thead>
                <tbody id="requestRecords"></tbody>
              </table>
              <p class="empty-state" id="emptyState">暂无提交记录。请先在首页提交一条 Demo 需求。</p>
            </div>
          </article>
        </div>
      </section>
    </main>
    <script src="script.js?v=20260529"></script>
  </body>
</html>
